<script>
'use strict';
const KEY='coverme_demo_v1';
const uid=()=>typeof crypto.randomUUID==='function'?crypto.randomUUID():'cm-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const schools=[{id:'oak',name:'Oakfield Community School',area:'North Dublin',room:'G12'},{id:'elm',name:'Elmbridge College',area:'South Dublin',room:'B04'},{id:'river',name:'Riverbank Secondary School',area:'North Dublin',room:'A08'},{id:'hill',name:'Hillcrest Community College',area:'West Dublin',room:'C11'}];
const teachers=['Alex Murphy','Jamie Nolan','Sam Byrne','Taylor Walsh','Morgan Kelly','Casey Ryan','Robin Daly','Jordan Hayes'];
const dateKey=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'Europe/Dublin'});
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Dublin'}).format(new Date())}
function addDays(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function monday(s){let d=new Date(s+'T12:00:00');return addDays(s,-((d.getDay()+6)%7))}
function nextWorkday(s){let n=addDays(s,1);while([0,6].includes(new Date(n+'T12:00').getDay()))n=addDays(n,1);return n}
function displayDate(s,opts={weekday:'short',day:'numeric',month:'short'}){return new Date(s+'T12:00').toLocaleDateString('en-IE',opts)}
function seed(){let base=nextWorkday(today()),days=[base];for(let i=1;i<7;i++)days.push(nextWorkday(days[i-1]));let offers=Array.from({length:10},(_,i)=>({id:'o'+i,school:['oak','oak','elm','river','oak','hill','oak','river','elm','oak'][i],date:days[Math.floor(i/2)],start:i%2?'11:00':'09:00',end:i%2?'12:00':'10:00',subject:['Geography','Digital Technology','English','Geography','Geography','Mathematics','Digital Technology','English','Geography','Geography'][i],year:['2nd year','1st year','3rd year'][i%3],room:['G12','ICT 1','B04'][i%3],status:i<2?'accepted':'pending',deadline:days[Math.floor(i/2)]+'T'+(i%2?'10:30':'08:30'),notes:'Cover the topic in the linked lesson plan. Materials are available from the school office.'}));return {version:1,role:'teacher',page:'overview',profile:{name:'Alex Murphy',mode:'single',school:'oak',area:'North Dublin',subjects:['Geography','Digital Technology'],travel:30},offers,availability:Object.fromEntries(days.map(d=>[d,'Full day'])),plans:{o0:{topic:'Reading an Ordnance Survey map',objectives:'Identify four map symbols and use a six-figure grid reference.',activities:'Starter: identify familiar symbols (5 min).\nModel a grid reference (10 min).\nPaired map task (25 min).\nExit question and review (10 min).',resources:'Sample map worksheet, board and pencils.',assessment:'Check each pair’s grid references; collect exit answers.'}},tickets:[{id:'t1',type:'General query',subject:'Where can I collect the classroom key?',message:'Please confirm the collection point before my next cover lesson.',school:'oak',date:today(),status:'Acknowledged',reply:'Collect the sample key from reception.'},{id:'t2',type:'Leave request',subject:'Leave request for a college session',message:'Sample request for a future college session.',school:'oak',date:today(),start:days[5],end:days[5],status:'Submitted',reply:''}],notifications:[{id:'welcome',text:'Welcome to the sample workspace. Switch to school view to create a cover offer.',at:new Date().toISOString(),read:false}],school:'oak',week:monday(base),test:{tried:'',issue:'',changed:''}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY));if(!S||S.version!==1)S=seed()}catch{S=seed()}let filter='pending';let toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch{toast('Browser storage is unavailable. Changes cannot survive refresh.');return false}}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,4500)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const school=id=>schools.find(x=>x.id===id)||schools[0];
function badge(s){return '<span class="badge '+esc(s.toLowerCase())+'">'+esc(s)+'</span>'}
function notify(text){S.notifications.unshift({id:uid(),text,at:new Date().toISOString(),read:false});S.notifications=S.notifications.slice(0,60)}
function status(o){return o.status==='pending'&&new Date(o.deadline).getTime()<=Date.now()?'expired':o.status}
function matches(o){return S.profile.mode==='single'?o.school===S.profile.school:school(o.school).area===S.profile.area&&S.profile.subjects.includes(o.subject)}
function eligibleOffers(){return S.offers.filter(o=>matches(o)||o.status==='accepted')}
function overlap(a,b,buffer=0){return a.date===b.date&&(mins(a.start)<mins(b.end)+buffer&&mins(b.start)<mins(a.end)+buffer)}
function mins(t){let [h,m]=t.split(':').map(Number);return h*60+m}
function blockReason(o){if(status(o)!=='pending')return 'This offer is '+status(o)+'.';let av=S.availability[o.date]||'Unavailable';if(av==='Unavailable')return 'You are marked unavailable on this date.';if(av==='Morning'&&mins(o.end)>12*60+30)return 'This lesson is outside your morning availability.';if(av==='Afternoon'&&mins(o.start)<12*60+30)return 'This lesson is outside your afternoon availability.';let clash=[...S.offers,...seasonalLessons()].find(b=>b.id!==o.id&&b.status==='accepted'&&overlap(o,b,o.school===b.school?0:Number(S.profile.travel)));return clash?'Clashes with a confirmed lesson or your cross-school travel buffer.':''}
function nav(page){S.page=page;persist();render();document.getElementById('main').focus()}
function switchRole(){S.role=S.role==='teacher'?'school':'teacher';S.page='overview';persist();render();toast('Switched to '+S.role+' demonstration view. This is not a secure login.')}
const linksTeacher=[['overview','⌂','Overview'],['offers','▤','Cover offers'],['timetable','▦','My timetable'],['plans','✎','Lesson planner'],['availability','◷','Availability'],['portal','✉','School portal'],['settings','⚙','Preferences'],['about','ⓘ','About this demo']];const linksSchool=[['overview','⌂','School overview'],['manage','▤','Manage cover'],['staff','♧','Available teachers'],['portal','✉','Staff requests'],['about','ⓘ','About this demo']];
linksTeacher.splice(5,0,['summer','☀','Summer / holiday work']);linksSchool.splice(2,0,['summer','☀','Summer / holiday work']);
const linksBoard=[['overview','⌂','Exam body overview'],['summer','☀','Summer / holiday work'],['about','ⓘ','About this demo']];
function header(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${S.role==='teacher'?'Teacher workspace':S.role==='board'?'Exam body workspace':'School workspace'} · Sample data</div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function render(){ensureSeasonal();document.getElementById('nav').innerHTML=(S.role==='teacher'?linksTeacher:S.role==='board'?linksBoard:linksSchool).map(([p,i,n])=>`<button class="${S.page===p?'active':''}" onclick="nav('${p}')" ${S.page===p?'aria-current="page"':''}><span class="navicon" aria-hidden="true">${i}</span>${n}</button>`).join('');document.getElementById('roleBtn').value=S.role;document.getElementById('alertCount').textContent=S.notifications.filter(n=>!n.read).length||'';let pages={overview:S.role==='teacher'?overview:S.role==='board'?boardOverview:schoolOverview,summer:summerPage,offers:offersPage,timetable:timetable,plans:plansPage,availability:availabilityPage,portal:portalPage,settings:settingsPage,about:aboutPage,manage:managePage,staff:staffPage};document.getElementById('main').innerHTML=(pages[S.page]||overview)()+`<footer class="footer">Sub Teaching · Fictional student project · All records are sample data.<br>Saved on this browser only. No real accounts, messages or push notifications. No school or examination-body affiliation. Please do not enter personal or pupil information.</footer>`}
function setRole(role){seasonalFilter='All';S.role=role;S.page='overview';persist();render();toast('Previewing '+(role==='board'?'exam body':role)+' view. Fictional demonstration only.')}
function illustration(){return `<svg viewBox="0 0 340 210" role="img" aria-label="Illustration of a teacher beside a school and lesson board"><circle cx="215" cy="106" r="95" fill="#7684c3"/><path d="M152 84l66-42 67 42v93H152z" fill="#eef0ff"/><path d="M141 85l77-52 79 52" fill="none" stroke="#b3d99e" stroke-width="12" stroke-linejoin="round"/><path d="M206 133h26v44h-26z" fill="#5367a9"/><g fill="#a0c4e9"><path d="M170 98h22v22h-22zm76 0h22v22h-22zm-76 36h22v22h-22zm76 0h22v22h-22z"/></g><circle cx="218" cy="77" r="11" fill="#fff"/><path d="M218 70v8l5 3" stroke="#6354a6" fill="none" stroke-width="2"/><rect x="30" y="94" width="96" height="65" rx="5" fill="#41487e" stroke="#a4c9ec" stroke-width="3"/><path d="M45 113h58m-58 12h38m-38 12h50" stroke="#e7f5e2" stroke-width="3" stroke-linecap="round"/><path d="M45 160l-8 27m73-27 8 27" stroke="#bbb0df" stroke-width="5"/><circle cx="137" cy="99" r="15" fill="#dca67e"/><path d="M122 96q0-25 21-14l9 15-17-6z" fill="#26312a"/><path d="M116 167l9-49q13-9 26 0l9 49" fill="#a9c7ed"/><path d="M127 165l-3 29m23-29 6 29" stroke="#e9e4ce" stroke-width="11" stroke-linecap="round"/><path d="M125 126l-18 18-14-8m54-9 16 13" stroke="#dca67e" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M16 197h300" stroke="#a9c7ed" stroke-width="3"/><path d="M296 169v25m-10-39q10-29 20 0v19h-20z" fill="#b3d99e"/><path d="M33 52l4-8 4 8 9 2-9 3-4 8-4-8-9-3z" fill="#b9db9f"/></svg>`}
function stat(n,t){return `<div class="stat"><strong>${n}</strong><span>${t}</span></div>`}
function offerCard(o,compact=false){let st=status(o),reason=st==='pending'?blockReason(o):'',deadline=displayDate(o.deadline.slice(0,10))+' · '+o.deadline.slice(11,16);return `<article class="offer"><div class="offer-top"><div><div class="eyebrow">${esc(school(o.school).area)}</div><h3>${esc(o.subject)} · ${esc(o.year)}</h3><div class="muted">${esc(school(o.school).name)}</div></div>${badge(st)}</div><p class="meta">${displayDate(o.date)} · ${esc(o.start)}–${esc(o.end)} · Room ${esc(o.room)}</p>${compact?'':`<p class="meta">${esc(o.notes)}</p>`}${st==='pending'?`<div class="small">Respond by ${deadline}</div>${reason?`<p class="reason">${reason}</p>`:''}<div class="actions"><button class="primary" onclick="respond('${o.id}','accepted')" ${reason?'disabled':''}>Accept cover</button><button onclick="respond('${o.id}','declined')">Decline</button></div>`:st==='accepted'?`<div class="actions"><button onclick="editPlan('${o.id}')">${S.plans[o.id]?'Open':'Create'} lesson plan</button></div>`:''}</article>`}
function overview(){let list=eligibleOffers(),pending=list.filter(o=>status(o)==='pending'),accepted=S.offers.filter(o=>o.status==='accepted'&&o.date>=today()),tom=nextWorkday(today()),tomLessons=accepted.filter(o=>o.date===tom);return header('A clearer week ahead, Alex.',displayDate(today(),{weekday:'long',day:'numeric',month:'long'}))+`<section class="hero"><div><div class="eyebrow">Less chasing. More teaching.</div><h2>Your next lesson starts with a little clarity.</h2><p>Cover offers, lesson plans and school conversations. One calm place to organise your teaching week.</p><button onclick="nav('offers')">View cover offers →</button></div>${illustration()}</section><div class="stats">${stat(pending.length,'Offers awaiting your response')}${stat(accepted.length,'Upcoming confirmed lessons')}${stat(accepted.filter(o=>S.plans[o.id]?.topic).length,'Lessons with a saved plan')}${stat(S.tickets.filter(t=>t.status==='Submitted').length,'Requests awaiting acknowledgement')}</div><div class="grid"><section><div class="cardhead"><h2>Your cover inbox</h2><button onclick="nav('offers')">View all</button></div>${pending.slice(0,2).map(o=>offerCard(o,true)).join('')||'<div class="empty">No pending offers match your preferences.</div>'}</section><section><div class="card soft"><div class="eyebrow">Next school day · ${displayDate(tom)}</div><h2>${tomLessons.length?'You have '+tomLessons.length+' confirmed lessons.':'No cover confirmed yet.'}</h2><p class="muted">${tomLessons.length?'Your confirmed lessons are below. Check your timetable for the full week.':'This is not a day-off confirmation. New offers may still arrive; this prototype only alerts while open.'}</p>${tomLessons.map(o=>`<div class="row"><div class="datebox"><strong>${o.start}</strong>${o.end}</div><div><strong>${esc(o.subject)}</strong><div class="small">${esc(school(o.school).name)}</div></div></div>`).join('')}<div class="actions"><button onclick="nav('timetable')">Open timetable</button></div></div><div class="card"><h3>Your working setup</h3><p class="muted">${S.profile.mode==='single'?'One school · '+esc(school(S.profile.school).name):'Multiple schools · '+esc(S.profile.area)}</p><button onclick="nav('settings')">Change preferences</button></div></section></div>`}
function offersPage(){let list=eligibleOffers().filter(o=>filter==='all'||status(o)===filter);return header('Cover offers','Clear details. Your choice. Confirmed work goes straight into your timetable.')+`<div class="tabs">${['pending','accepted','declined','expired','all'].map(x=>`<button class="${filter===x?'selected':''}" onclick="filter='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="notice green">Offers match your ${S.profile.mode==='single'?'designated school':'selected area and subjects'}. Set your availability before accepting. Accepted lessons stay visible if preferences change.</div>${list.map(o=>offerCard(o)).join('')||'<div class="empty">No offers in this view. Try another filter or create one from school view.</div>'}`}
function respond(id,result){let o=S.offers.find(o=>o.id===id);if(result==='accepted'){let reason=blockReason(o);if(reason){toast(reason);render();return}}else if(status(o)!=='pending'){toast('This offer is no longer available.');render();return}o.status=result;notify(`${o.subject} at ${school(o.school).name} on ${displayDate(o.date)}: ${result}.`);persist();render();toast(result==='accepted'?'Cover confirmed. Your timetable has been updated.':'Offer declined.')}
function timetable(){let start=S.week,accepted=[...S.offers.filter(o=>o.status==='accepted'),...seasonalLessons()];return header('Your teaching week','Confirmed lessons and holiday appointments. Open a cover lesson to prepare its plan.')+`<div class="toolbar"><button onclick="changeWeek(-7)" aria-label="Previous week">←</button><strong>${displayDate(start)} – ${displayDate(addDays(start,4))}</strong><button onclick="changeWeek(7)" aria-label="Next week">→</button><button onclick="S.week=monday(today());persist();render()">This week</button></div><div class="week">${Array.from({length:5},(_,i)=>{let d=addDays(start,i),list=accepted.filter(o=>o.date===d).sort((a,b)=>a.start.localeCompare(b.start));return `<section class="day"><h3>${displayDate(d)}</h3><div class="small" style="margin-bottom:10px">${list.some(o=>o.seasonal)?'Holiday work booked':esc(S.availability[d]||'Unavailable')}</div>${list.map(o=>`<article class="lesson"><strong>${o.start}–${o.end}</strong><strong>${esc(o.subject)}</strong><div>${esc(o.year)} · ${esc(o.room)}</div><div class="meta">${esc(o.seasonal?o.organiser:school(o.school).name)}</div>${o.seasonal?'<span class="badge accepted">Holiday work confirmed</span>':`<span class="badge">${S.plans[o.id]?.topic?'Plan saved':'Needs a plan'}</span><br><button onclick="editPlan('${o.id}')">Open lesson</button>`}</article>`).join('')||'<p class="small">No confirmed lessons</p>'}</section>`}).join('')}</div>`}
function changeWeek(n){S.week=addDays(S.week,n);persist();render()}
function plansPage(){let list=S.offers.filter(o=>o.status==='accepted').sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));return header('A little preparation goes a long way.','Lesson plans are linked to your confirmed cover bookings.')+`<div class="notice">Use sample teaching content only. Do not enter pupil names, learning needs or other personal information.</div>${list.map(o=>`<div class="card"><div class="cardhead"><div><span class="eyebrow">${displayDate(o.date)} · ${o.start}</span><h3>${esc(o.subject)} · ${esc(o.year)}</h3><span class="small">${esc(school(o.school).name)}</span></div>${badge(S.plans[o.id]?.topic?'Plan saved':'Needs a plan')}</div><p>${esc(S.plans[o.id]?.topic||'Start with an objective, an activity and a quick check for understanding.')}</p><button onclick="editPlan('${o.id}')">${S.plans[o.id]?'Edit':'Create'} lesson plan</button></div>`).join('')||'<div class="empty">Accept a cover offer to start a linked lesson plan.</div>'}`}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').showModal()}
function editPlan(id){let o=S.offers.find(x=>x.id===id),p=S.plans[id]||{};modal('Plan your lesson',`<p class="muted">${esc(o.subject)} · ${displayDate(o.date)} · ${o.start}–${o.end}</p><form onsubmit="savePlan(event,'${id}')"><div class="formgrid"><label class="full">Lesson topic<input name="topic" required maxlength="120" value="${esc(p.topic||'')}"></label><label class="full">Learning objectives<textarea name="objectives" required maxlength="1500">${esc(p.objectives||'')}</textarea></label><label class="full">Activities and timings<textarea name="activities" required maxlength="3000">${esc(p.activities||'')}</textarea></label><label>Resources<textarea name="resources" maxlength="1500">${esc(p.resources||'')}</textarea></label><label>Check for understanding<textarea name="assessment" maxlength="1500">${esc(p.assessment||'')}</textarea></label></div><div class="actions"><button class="primary">Save lesson plan</button><button type="button" onclick="document.getElementById('modal').close()">Cancel</button></div></form>`)}
function savePlan(e,id){e.preventDefault();S.plans[id]=Object.fromEntries(new FormData(e.target));persist();document.getElementById('modal').close();render();toast('Lesson plan saved on this browser.')}
function availabilityPage(){let days=Array.from({length:14},(_,i)=>addDays(today(),i)).filter(d=>![0,6].includes(new Date(d+'T12:00').getDay()));return header('Tell schools when you can teach.','Availability is a preference, not a booking. Confirmed lessons require a separate cancellation.')+`<form onsubmit="saveAvailability(event)" class="card"><div class="formgrid">${days.map(d=>`<label>${displayDate(d)}<select name="${d}">${['Unavailable','Full day','Morning','Afternoon'].map(x=>`<option ${S.availability[d]===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div><p class="small" style="margin-top:18px">Morning: lessons ending by 12:30. Afternoon: lessons starting at or after 12:30.</p><button class="primary">Save availability</button></form>`}
function saveAvailability(e){e.preventDefault();let changes=Object.fromEntries(new FormData(e.target));for(let [d,v]of Object.entries(changes)){let bookings=[...S.offers,...seasonalLessons()].filter(o=>o.status==='accepted'&&o.date===d);if(bookings.some(o=>v==='Unavailable'||v==='Morning'&&mins(o.end)>750||v==='Afternoon'&&mins(o.start)<750)){toast('Availability conflicts with confirmed cover on '+displayDate(d)+'. Ask the school to cancel it first.');return}}Object.assign(S.availability,changes);persist();render();toast('Availability saved.')}
function settingsPage(){return header('Make Sub Teaching fit your week.','Choose one school or make yourself available in a selected area.')+`<form class="card" onsubmit="saveSettings(event)"><div class="formgrid"><label>Working arrangement<select name="mode" id="mode" onchange="toggleMode()"><option value="single" ${S.profile.mode==='single'?'selected':''}>One designated school</option><option value="multi" ${S.profile.mode==='multi'?'selected':''}>Multiple schools in an area</option></select></label><label id="schoolField">Designated school<select name="school">${schools.map(x=>`<option value="${x.id}" ${S.profile.school===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><label id="areaField">Preferred area<select name="area">${['North Dublin','South Dublin','West Dublin'].map(x=>`<option ${x===S.profile.area?'selected':''}>${x}</option>`).join('')}</select></label><label>Travel buffer between schools (minutes)<input name="travel" type="number" min="15" max="180" required value="${S.profile.travel}"></label><div class="full"><label>Subjects you can offer</label><div class="checks" style="margin-top:8px">${['Geography','Digital Technology','English','Mathematics'].map(x=>`<label><input type="checkbox" name="subjects" value="${x}" ${S.profile.subjects.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div></div><p class="small" style="margin-top:18px">Area matching is a sample filter, not live distance routing. Subject preferences are not a verification of teaching eligibility. No qualification checks are performed in this prototype.</p><button class="primary">Save preferences</button></form>`}
function toggleMode(){let multi=document.getElementById('mode').value==='multi';document.getElementById('schoolField').hidden=multi;document.getElementById('areaField').hidden=!multi}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target),subjects=f.getAll('subjects');if(!subjects.length){toast('Choose at least one subject.');return}Object.assign(S.profile,{mode:f.get('mode'),school:f.get('school'),area:f.get('area'),travel:Number(f.get('travel')),subjects});persist();render();toast('Preferences saved. Your cover inbox now uses these settings.')}
function portalPage(){if(S.role==='teacher'&&S.profile.mode!=='single')return header('School correspondence','Your designated-school portal.')+`<div class="card"><h2>This portal is for teachers linked to one school.</h2><p>In multiple-school mode, each booking includes school instructions. A private ongoing staff portal becomes available when you choose a designated school.</p><button onclick="nav('settings')">Change working arrangement</button></div>`;let sid=S.role==='school'?S.school:S.profile.school,list=S.tickets.filter(t=>t.school===sid);return header(S.role==='school'?'Staff requests':'Your school portal',esc(school(sid).name),S.role==='teacher'?'<button class="primary" onclick="newTicket()">New request +</button>':'')+(S.role==='school'?schoolSelect():'')+`<div class="notice green">Sickness is reported, not approved. Reporting it here does not cancel confirmed teaching; the coordinator must arrange replacement cover.</div>${list.map(t=>`<article class="card"><div class="cardhead"><div><span class="eyebrow">${esc(t.type)} · ${displayDate(t.date)}</span><h3>${esc(t.subject)}</h3></div>${badge(t.status)}</div>${t.start?`<p class="small">${displayDate(t.start)} – ${displayDate(t.end)}</p>`:''}<p>${esc(t.message)}</p>${t.reply?`<div class="notice green"><strong>School response:</strong> ${esc(t.reply)}</div>`:''}${S.role==='school'?`<button onclick="replyTicket('${t.id}')">Respond / update status</button>`:''}</article>`).join('')||'<div class="empty">No requests for this school yet.</div>'}`}
function newTicket(){modal('New school request',`<form onsubmit="saveTicket(event)"><div class="formgrid"><label>Request type<select name="type" onchange="document.getElementById('requestDates').hidden=this.value==='General query'||this.value==='Pay query'||this.value==='Personal details query'"><option>General query</option><option>Leave request</option><option>Sickness report</option><option>Pay query</option><option>Personal details query</option></select></label><label>Subject<input name="subject" maxlength="100" required></label><div class="full formgrid" id="requestDates" hidden><label>From<input type="date" name="start" min="${today()}"></label><label>To<input type="date" name="end" min="${today()}"></label></div><label class="full">Sample message<textarea name="message" required maxlength="2000" placeholder="Use fictional details only. Do not enter health, bank or identity information."></textarea></label></div><p class="small">Saved locally in this demonstration. Nothing is sent to a school.</p><button class="primary">Submit sample request</button></form>`)}
function saveTicket(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),dated=['Leave request','Sickness report'].includes(f.type);if(dated&&(!f.start||!f.end||f.end<f.start)){toast('Choose a valid start and end date.');return}S.tickets.unshift({...f,start:dated?f.start:null,end:dated?f.end:null,id:uid(),school:S.profile.school,date:today(),status:'Submitted',reply:''});notify('New '+f.type.toLowerCase()+': '+f.subject);persist();document.getElementById('modal').close();render();toast('Sample request added to the school queue.')}
function replyTicket(id){let t=S.tickets.find(x=>x.id===id),options=t.type==='Leave request'?['Submitted','Acknowledged','Approved','Declined']:['Submitted','Acknowledged','Resolved'];modal('Respond to staff request',`<p>${esc(t.subject)}</p><form onsubmit="saveReply(event,'${id}')"><label>Status<select name="status">${options.map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></label><label style="margin-top:15px">School response<textarea name="reply" required maxlength="2000">${esc(t.reply)}</textarea></label><div class="actions"><button class="primary">Save response</button></div></form>`)}
function saveReply(e,id){e.preventDefault();let t=S.tickets.find(x=>x.id===id);Object.assign(t,Object.fromEntries(new FormData(e.target)));notify('School response to “'+t.subject+'”: '+t.status+'.');persist();document.getElementById('modal').close();render();toast('Response saved. Visible in teacher view.')}
function schoolSelect(){return `<div class="toolbar"><label>Demonstration school<select onchange="S.school=this.value;persist();render()">${schools.map(x=>`<option value="${x.id}" ${x.id===S.school?'selected':''}>${x.name}</option>`).join('')}</select></label></div>`}
function schoolOverview(){let offers=S.offers.filter(o=>o.school===S.school),pending=offers.filter(o=>status(o)==='pending'),unread=S.tickets.filter(t=>t.school===S.school&&t.status==='Submitted');return header('Keep your school day covered.',esc(school(S.school).name),'<button class="primary" onclick="newOffer()">Offer cover +</button>')+schoolSelect()+`<section class="hero"><div><div class="eyebrow">School cover desk</div><h2>From an empty classroom to confirmed cover.</h2><p>Create an offer, follow the response and keep instructions together. All interactions here use fictional sample data.</p><button onclick="nav('manage')">Manage cover →</button></div>${illustration()}</section><div class="stats">${stat(pending.length,'Offers awaiting a teacher')}${stat(offers.filter(o=>o.status==='accepted').length,'Confirmed lessons')}${stat(pending.filter(o=>new Date(o.deadline)-Date.now()<86400000).length,'Unfilled · response due within 24 hours')}${stat(unread.length,'Staff requests to acknowledge')}</div><div class="grid"><div class="card"><h2>Cover needing attention</h2>${pending.map(o=>`<div class="row"><div class="datebox"><strong>${o.start}</strong>${displayDate(o.date,{day:'numeric',month:'short'})}</div><div class="grow"><strong>${esc(o.subject)}</strong><div class="small">${esc(o.year)} · Room ${esc(o.room)}</div></div>${badge('pending')}</div>`).join('')||'<p class="muted">No pending cover offers.</p>'}<div class="actions"><button onclick="nav('manage')">Open cover desk</button></div></div><div class="card soft"><h2>Try both sides</h2><p>Create an offer for a date when Alex is available. Choose Teacher in Preview role, accept it, then return here to see the confirmation.</p><p class="small">The preview role selector is a demonstration control. It provides no privacy or access protection.</p></div></div>`}
function managePage(){let list=S.offers.filter(o=>o.school===S.school).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));return header('Your cover desk','Create offers and track responses without chasing a message thread.','<button class="primary" onclick="newOffer()">Offer cover +</button>')+schoolSelect()+list.map(o=>`<article class="card"><div class="cardhead"><div><div class="eyebrow">${displayDate(o.date)} · ${o.start}–${o.end}</div><h3>${esc(o.subject)} · ${esc(o.year)}</h3><div class="small">Room ${esc(o.room)} · ${o.status==='accepted'?'Confirmed with Alex Murphy':'Sample offer for Alex Murphy'}</div></div>${badge(status(o))}</div><p class="meta">Response deadline: ${displayDate(o.deadline.slice(0,10))} ${o.deadline.slice(11,16)}</p>${status(o)==='pending'&&new Date(o.deadline)-Date.now()<86400000?'<div class="notice">Unfilled and due within 24 hours. Coordinator attention needed.</div>':''}${['pending','accepted'].includes(status(o))?`<button class="danger" onclick="cancelOffer('${o.id}')">Cancel cover offer</button>`:''}</article>`).join('')}
function newOffer(){let d=nextWorkday(today());modal('Offer a cover lesson',`<form onsubmit="saveOffer(event)"><div class="formgrid"><label>School<select name="school">${schools.map(x=>`<option value="${x.id}" ${x.id===S.school?'selected':''}>${x.name}</option>`).join('')}</select></label><label>Lesson date<input type="date" name="date" min="${today()}" required value="${d}"></label><label>Subject<select name="subject"><option>Geography</option><option>Digital Technology</option><option>English</option><option>Mathematics</option></select></label><label>Year group<select name="year"><option>1st year</option><option>2nd year</option><option>3rd year</option><option>Transition year</option><option>5th year</option><option>6th year</option></select></label><label>Start time<input type="time" name="start" value="13:30" required></label><label>End time<input type="time" name="end" value="14:30" required></label><label>Room<input name="room" required maxlength="40" value="G12"></label><label>Respond by (local time)<input type="datetime-local" name="deadline" value="${d}T12:30" required></label><label class="full">Lesson instructions<textarea name="notes" required maxlength="1500">Sample cover instructions: collect the worksheet from reception.</textarea></label></div><p class="small">This creates an offer for sample teacher Alex. It appears in their inbox if their school/area and subject preferences match.</p><button class="primary">Create cover offer</button></form>`)}
function saveOffer(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),start=new Date(f.date+'T'+f.start),deadline=new Date(f.deadline);if(f.end<=f.start||start<=new Date()||deadline<=new Date()||deadline>start){toast('Use a future lesson, an end after its start and a future response deadline no later than lesson start.');return}if(S.offers.some(o=>o.school===f.school&&o.room.toLowerCase()===f.room.toLowerCase()&&!['cancelled','declined'].includes(o.status)&&overlap(o,f))){toast('That school room already has an overlapping cover request.');return}let o={...f,id:uid(),status:'pending'};S.offers.unshift(o);notify('New cover offer: '+f.subject+' at '+school(f.school).name+' on '+displayDate(f.date)+'.');persist();document.getElementById('modal').close();render();toast('Offer created. Choose Teacher in Preview role to respond.')}
function cancelOffer(id){let o=S.offers.find(x=>x.id===id);modal('Cancel this cover?',`<p>${esc(o.subject)} · ${displayDate(o.date)} · ${o.start}</p><p>The lesson will leave the confirmed timetable. Its saved plan will be retained in browser storage.</p><button class="danger" onclick="confirmCancel('${id}')">Confirm cancellation</button>`)}
function confirmCancel(id){let o=S.offers.find(x=>x.id===id);o.status='cancelled';notify('Cover cancelled: '+o.subject+' on '+displayDate(o.date)+'.');persist();document.getElementById('modal').close();render();toast('Cover cancelled and teacher alerted in-app.')}
function staffPage(){let d=nextWorkday(today());return header('Available teachers','Eight fictional teacher records. Alex’s availability is interactive; other profiles are illustrative.')+schoolSelect()+`<div class="card"><label>Check date<input type="date" id="staffDate" value="${d}" onchange="document.getElementById('staffList').innerHTML=staffRows(this.value)"></label><div id="staffList">${staffRows(d)}</div></div>`}
function staffRows(d){return teachers.map((n,i)=>{let av=i===0?(S.availability[d]||'Unavailable'):['Full day','Morning','Unavailable','Afternoon'][i%4],bookings=i===0?S.offers.filter(o=>o.status==='accepted'&&o.date===d).length:0;return `<div class="listline"><div class="avatar">${n.split(' ').map(x=>x[0]).join('')}</div><div class="grow"><strong>${n}</strong><div class="small">${i===0?esc(S.profile.subjects.join(' · ')):['English · Geography','Mathematics','Digital Technology'][i%3]}${i===0&&bookings?' · '+bookings+' confirmed lessons':''}</div></div>${badge(av)}</div>`}).join('')}
function showAlerts(){modal('In-app notifications',`<p class="small">Shared demonstration activity feed. No push, email or SMS is sent. Alerts are visible only in this browser.</p><button onclick="S.notifications.forEach(n=>n.read=true);persist();render();document.getElementById('modal').close()">Mark all as read</button><div style="margin-top:15px">${S.notifications.map(n=>`<div class="notification"><strong>${n.read?'':'• '}${esc(n.text)}</strong><div class="small">${new Date(n.at).toLocaleString('en-IE')}</div></div>`).join('')||'No alerts yet.'}</div>`)}
function aboutPage(){return header('Built to make cover clearer.','Prototype scope, brief checks and an honest testing record.')+`<div class="notice">Fictional concept for Irish secondary-school student substitutes and school cover coordinators. This is the demo, not the final project landing page.</div><div class="card"><h2>What works here</h2><div class="tablewrap"><table><thead><tr><th>User requirement</th><th>Demonstrated behaviour</th></tr></thead><tbody><tr><td>Choose one school or several nearby</td><td>Preferences filter offers by designated school, or area and subjects.</td></tr><tr><td>Receive and respond to offers</td><td>School-created offers, in-app alerts, accept/decline and automatic expiry. Summer roles support applications, organiser decisions and teacher acceptance.</td></tr><tr><td>A dependable weekly schedule</td><td>Accepted lessons populate the timetable; overlap and travel-buffer checks block conflicting acceptance.</td></tr><tr><td>Prepare lessons</td><td>Save objectives, timed activities, resources and assessment against confirmed lessons.</td></tr><tr><td>Communicate with a designated school</td><td>Submit leave, sickness and query records; school responses update their status.</td></tr><tr><td>Keep changes after a refresh</td><td>Browser local storage retains demonstration records and preferences.</td></tr></tbody></table></div></div><div class="grid"><div class="card"><h2>Planned for a real service</h2><ul class="help-list"><li>Secure, verified school and teacher accounts with private access.</li><li>Server storage shared across devices and schools.</li><li>Background push/email alerts with delivery tracking.</li><li>Verified teacher eligibility and school onboarding.</li><li>Real travel routing and configurable school schedules.</li></ul><p class="small">A proposed school subscription would fund the service. Pricing is not validated and is not charged in this prototype.</p></div><div class="card"><h2>Before the final submission</h2><ul class="help-list"><li>Publish a landing page with a clear promise, CTA and one-click access to this demo.</li><li>Research two real alternatives at source, with checked dates.</li><li>Test with a real person who did not build it and record the changes.</li><li>Complete your own reflection without AI.</li></ul></div></div><div class="card"><h2>Real-person testing record</h2><p class="muted">Not yet completed. Do not present automated checks as a real-person test. After your girlfriend tries the demo, record the actual feedback below.</p><form onsubmit="saveTest(event)"><div class="formgrid"><label class="full">What did the tester try?<textarea name="tried" required maxlength="1500">${esc(S.test.tried)}</textarea></label><label>What broke or confused them?<textarea name="issue" required maxlength="1500">${esc(S.test.issue)}</textarea></label><label>What did you change?<textarea name="changed" required maxlength="1500">${esc(S.test.changed)}</textarea></label></div><p class="small">Saved only in this browser. Export the record to keep it, then include verified findings on the final landing page.</p><div class="actions"><button class="primary">Save testing notes</button><button type="button" onclick="exportTest()">Download testing notes</button></div></form></div><div class="card"><h2>Try the core journey</h2><ol class="help-list"><li>Choose School in Preview role and create a Geography offer at Oakfield for an available future date, outside existing lessons.</li><li>Choose Teacher in Preview role. Open Alerts and Cover offers.</li><li>Accept the offer. Find it in the weekly timetable.</li><li>Create a lesson plan and refresh to check it remains saved.</li><li>Submit a sample school query, then respond from school view.</li><li>Try an overlapping offer and confirm acceptance is blocked.</li></ol><button class="danger" onclick="resetDemo()">Reset all sample data</button></div>`}
function saveTest(e){e.preventDefault();S.test=Object.fromEntries(new FormData(e.target));persist();toast('Testing notes saved locally. Export them to keep a copy.')}
function exportTest(){let b=new Blob(['Sub Teaching real-person testing record\n\n'+Object.entries(S.test).map(([k,v])=>k.toUpperCase()+':\n'+v).join('\n\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sub-teaching-testing-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetDemo(){modal('Reset the demo?',`<p>This removes all your local edits, plans and testing notes and restores fictional sample records. Export testing notes first if needed.</p><button class="danger" onclick="S=seed();persist();document.getElementById('modal').close();render();toast('Sample data restored.')">Reset sample data</button>`)}
function ensureSeasonal(){if(S.opportunities)return;let yr=Number(today().slice(0,4))+1;S.opportunities=Array.from({length:8},(_,i)=>{let kind=i%3===2?'Exam supervision':i%3===1?'Summer course':'School camp',d=yr+'-'+(kind==='Exam supervision'?'06':'07')+'-'+String(7+Math.floor(i/3)*7).padStart(2,'0');return {id:'summer'+i,kind,title:kind==='Exam supervision'?'Examination room supervisor':kind==='Summer course'?'Summer learning course tutor':'Holiday activity camp teacher',school:['oak','river','board','elm','oak','board','hill','river'][i],organiser:kind==='Exam supervision'?'Sample National Examination Office':school(['oak','river','oak','elm','oak','oak','hill','river'][i]).name,area:['North Dublin','North Dublin','South Dublin','South Dublin','North Dublin','West Dublin','West Dublin','North Dublin'][i],from:d,to:addDays(d,4),start:'09:00',end:'13:00',deadline:addDays(d,-14),places:2,rate:kind==='Exam supervision'?100:120,details:kind==='Exam supervision'?'Fictional examination-room supervision opportunity. All appointments require organiser verification; this app does not establish eligibility.':'Fictional holiday programme. Support the listed activities and follow the organiser’s safeguarding procedures.',requirements:'Sample requirement: relevant teaching experience and organiser verification before appointment.',closed:false}});S.applications=[]}
let seasonalFilter='All';
function postingClosed(p){return p.closed||today()>p.deadline}
function ownPosts(){return S.opportunities.filter(p=>S.role==='board'?p.school==='board':p.school===S.school)}
function applicationFor(id){return S.applications.find(a=>a.post===id)}
function remainingPlaces(p){return p.places-S.applications.filter(a=>a.post===p.id&&['Offered','Accepted'].includes(a.status)).length}
function onWeekday(d){return ![0,6].includes(new Date(d+'T12:00').getDay())}
function postDays(p){let ds=[];for(let d=p.from;d<=p.to;d=addDays(d,1))if(onWeekday(d))ds.push(d);return ds}
function seasonalLessons(){if(!S.opportunities)return[];return S.applications.filter(a=>a.status==='Accepted').flatMap(a=>{let p=S.opportunities.find(p=>p.id===a.post);return postDays(p).map(d=>({id:p.id+'-'+d,school:p.school,date:d,start:p.start,end:p.end,subject:p.title,year:p.kind,room:p.area,status:'accepted',seasonal:true,organiser:p.organiser}))})}
function seasonClash(p){let bookings=[...S.offers.filter(o=>o.status==='accepted'),...seasonalLessons()];return postDays(p).some(d=>bookings.some(b=>overlap({date:d,start:p.start,end:p.end},b,b.school===p.school?0:Number(S.profile.travel))))}
function boardOverview(){let posts=ownPosts(),apps=S.applications.filter(a=>posts.some(p=>p.id===a.post));return header('Coordinate examination supervision.','A proposed recruitment workspace for education and examination bodies.','<button class="primary" onclick="newSeasonalPost()">Post supervision role +</button>')+`<section class="hero"><div><div class="eyebrow">Exam body · demonstration</div><h2>One place to publish, review and confirm.</h2><p>Explore how an examination body could invite applications and manage supervision offers. No real exam body is connected to this prototype.</p><button onclick="nav('summer')">Open recruitment desk →</button></div>${illustration()}</section><div class="stats">${stat(posts.filter(p=>!postingClosed(p)).length,'Open sample supervision roles')}${stat(apps.filter(a=>a.status==='Applied').length,'Applications awaiting review')}${stat(apps.filter(a=>a.status==='Offered').length,'Offers awaiting teacher acceptance')}${stat(apps.filter(a=>a.status==='Accepted').length,'Confirmed sample appointments')}</div><div class="card"><h2>Appointments stay with the organiser.</h2><p>Schools and examination bodies review applications and make decisions. Applications and offers here are simulated. Identity, eligibility, training and appointment checks are planned for a real service.</p></div>`}
function summerPage(){let teacher=S.role==='teacher',posts=teacher?S.opportunities:ownPosts();posts=posts.filter(p=>seasonalFilter==='All'||p.kind===seasonalFilter);return header('Summer / holiday work',teacher?'Discover camps, summer courses and examination supervision.':S.role==='board'?'Publish supervision roles and review sample applications.':'Publish your school’s camps and courses, then review applications.',teacher?'':'<button class="primary" onclick="newSeasonalPost()">Post opportunity +</button>')+(!teacher&&S.role!=='board'?schoolSelect():'')+`<div class="notice">All opportunities, dates, rates and examination bodies below are fictional sample data. Nothing is submitted to a real organisation. Supervisor eligibility and official appointment processes are not verified here.</div><div class="tabs">${['All','School camp','Summer course','Exam supervision'].filter(x=>teacher||x==='All'||(S.role==='board'?x==='Exam supervision':x!=='Exam supervision')).map(x=>`<button class="${seasonalFilter===x?'selected':''}" onclick="seasonalFilter='${x}';render()">${x}</button>`).join('')}</div>${teacher?'<p class="small">Holiday opportunities are shown separately from term-time school preferences. Applying confirms interest in all listed weekdays; the organiser must still review suitability. The area and programme dates are shown on every role.</p>':''}${posts.map(p=>seasonalCard(p,teacher)).join('')||'<div class="empty">No opportunities in this view. Choose another category or post a new role.</div>'}`}
function seasonalCard(p,teacher){let a=applicationFor(p.id),closed=postingClosed(p),count=remainingPlaces(p),applicants=S.applications.filter(a=>a.post===p.id),days=postDays(p).length,hours=(mins(p.end)-mins(p.start))/60*days;return `<article class="card"><div class="cardhead"><div><div class="eyebrow">${esc(p.kind)} · ${esc(p.area)}</div><h2>${esc(p.title)}</h2><div class="muted">${esc(p.organiser)}</div></div>${badge(closed?'Closed':count<=0?'Full':'Open')}</div><p class="meta">${displayDate(p.from,{day:'numeric',month:'short',year:'numeric'})} – ${displayDate(p.to,{day:'numeric',month:'short',year:'numeric'})} · Weekdays ${p.start}–${p.end}<br>${days} working days · ${hours} scheduled hours · ${Math.max(0,count)} of ${p.places} places available</p><p>${esc(p.details)}</p><div class="notice green"><strong>Sample rate: €${p.rate} / day</strong> · €${p.rate*days} illustrative total before deductions. Not an official pay rate.</div><p class="small">${esc(p.requirements)}<br>Applications close ${displayDate(p.deadline)} at end of day in Ireland.</p>${teacher?`<div class="actions">${!a&&!closed&&count>0?`<button class="primary" onclick="applySeasonal('${p.id}')">Apply for this role</button>`:a?`${badge(a.status)}${a.status==='Offered'?`<button class="primary" onclick="acceptSeasonal('${a.id}')" ${seasonClash(p)?'disabled':''}>Accept appointment</button><button onclick="teacherSeasonalDecision('${a.id}','Declined')">Decline offer</button>`:['Applied','Shortlisted'].includes(a.status)?`<button onclick="teacherSeasonalDecision('${a.id}','Withdrawn')">Withdraw application</button>`:''}`:''}</div>${a?.status==='Offered'&&seasonClash(p)?'<p class="reason">This appointment conflicts with confirmed work or travel time. Resolve the clash before accepting.</p>':''}${a?.response?`<p class="meta"><strong>Organiser response:</strong> ${esc(a.response)}</p>`:''}${a?.status==='Accepted'?'<p class="small">Confirmed weekdays now appear in your timetable. Cancellation must be arranged with the organiser.</p>':''}`:`<div class="actions"><button onclick="reviewApplicants('${p.id}')">Review applications (${applicants.length})</button><button onclick="toggleSeasonal('${p.id}')">${p.closed?'Reopen applications':'Close applications'}</button></div>`}</article>`}
function applySeasonal(id){let p=S.opportunities.find(p=>p.id===id);if(postingClosed(p)||remainingPlaces(p)<=0||applicationFor(id)){toast('This opportunity is closed, full or already applied for.');return}modal('Apply for '+p.kind.toLowerCase(),`<p><strong>${esc(p.title)}</strong><br>${esc(p.organiser)} · ${displayDate(p.from,{day:'numeric',month:'short',year:'numeric'})} – ${displayDate(p.to,{day:'numeric',month:'short',year:'numeric'})}</p><form onsubmit="saveSeasonalApplication(event,'${id}')"><label>Sample application statement<textarea name="statement" maxlength="1500" required placeholder="Use fictional experience only. Do not include contact details or identifiers."></textarea></label><div class="checks" style="margin:15px 0"><label><input type="checkbox" required>I am applying for all listed weekdays and understand organiser checks are still required.</label></div><p class="small">This demonstration stores the application in this browser only. No CV, credentials or personal information is needed.</p><button class="primary">Submit sample application</button></form>`)}
function saveSeasonalApplication(e,id){e.preventDefault();let p=S.opportunities.find(p=>p.id===id);if(postingClosed(p)||remainingPlaces(p)<=0||applicationFor(id)){toast('This role is no longer available.');return}S.applications.push({id:uid(),post:id,teacher:'Alex Murphy',statement:new FormData(e.target).get('statement'),status:'Applied',date:today(),response:''});notify('Sample application submitted: '+p.title+'.');persist();document.getElementById('modal').close();render();toast('Application saved. Preview the organiser role to review it.')}
function reviewApplicants(id){let p=S.opportunities.find(p=>p.id===id),apps=S.applications.filter(a=>a.post===id);modal('Applications · '+p.title,`<p class="small">Fictional applicants only. Status updates are sample organiser decisions, not verified appointments.</p>${apps.map(a=>`<div class="card"><h3>${esc(a.teacher)}</h3><p>${esc(a.statement)}</p><form onsubmit="saveApplicationDecision(event,'${a.id}')"><label>Application status<select name="status">${(a.status==='Accepted'?['Accepted','Cancelled']:['Applied','Shortlisted','Offered','Rejected','Cancelled']).map(v=>`<option ${a.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label style="margin-top:12px">Sample response<textarea name="response" required maxlength="1200">${esc(a.response)}</textarea></label><div class="actions"><button class="primary">Save decision</button></div></form></div>`).join('')||'<div class="empty">No applications yet. Preview Teacher, open this role and submit a sample application.</div>'}`)}
function saveApplicationDecision(e,id){e.preventDefault();let a=S.applications.find(a=>a.id===id),p=S.opportunities.find(p=>p.id===a.post),f=Object.fromEntries(new FormData(e.target));if(['Withdrawn','Declined','Cancelled','Rejected'].includes(a.status)){toast('This application is finished. Its status cannot be changed.');return}if(f.status==='Offered'&&a.status!=='Offered'&&remainingPlaces(p)<=0){toast('There are no unreserved places left.');return}if(f.status==='Offered'&&p.to<today()){toast('This opportunity has already ended.');return}Object.assign(a,f);notify('Application update: '+p.title+' · '+a.status+'.');persist();document.getElementById('modal').close();render();toast('Decision saved. Teacher can view it in Summer / holiday work.')}
function acceptSeasonal(id){let a=S.applications.find(a=>a.id===id),p=S.opportunities.find(p=>p.id===a.post);if(a.status!=='Offered'||p.from<today()||seasonClash(p)){toast('This offer has started, is no longer available or conflicts with confirmed work.');return}a.status='Accepted';S.week=monday(p.from);notify('Appointment accepted: '+p.title+'.');persist();render();toast('Appointment confirmed. Open your timetable for '+displayDate(p.from)+'.')}
function teacherSeasonalDecision(id,status){let a=S.applications.find(a=>a.id===id);if(!['Applied','Shortlisted','Offered'].includes(a.status)){toast('This application cannot be changed.');return}a.status=status;notify('Summer application '+status.toLowerCase()+'.');persist();render();toast('Application updated.')}
function toggleSeasonal(id){let p=S.opportunities.find(p=>p.id===id);p.closed=!p.closed;persist();render();toast(p.closed?'Applications closed. Existing offers remain available to their recipients.':'Applications reopened, subject to the closing date.')}
function newSeasonalPost(){let board=S.role==='board',d=addDays(nextWorkday(today()),30);modal(board?'Post a supervision role':'Post summer / holiday work',`<form onsubmit="saveSeasonalPost(event)"><div class="formgrid"><label>Opportunity type<select name="kind">${(board?['Exam supervision']:['School camp','Summer course']).map(x=>`<option>${x}</option>`).join('')}</select></label><label>Role title<input name="title" required maxlength="120" placeholder="e.g. Summer geography course tutor"></label><label>Area<select name="area">${['North Dublin','South Dublin','West Dublin'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Number of places<input name="places" type="number" min="1" max="100" value="2" required></label><label>Programme begins<input type="date" name="from" min="${today()}" value="${d}" required></label><label>Programme ends<input type="date" name="to" min="${today()}" value="${addDays(d,4)}" required></label><label>Daily start<input type="time" name="start" value="09:00" required></label><label>Daily finish<input type="time" name="end" value="13:00" required></label><label>Applications close<input type="date" name="deadline" min="${today()}" value="${addDays(d,-7)}" required></label><label>Sample day rate (€)<input name="rate" type="number" min="1" max="2000" step=".01" value="120" required></label><label class="full">Role description<textarea name="details" required maxlength="1500"></textarea></label><label class="full">Requirements and checks<textarea name="requirements" required maxlength="1500">Sample organiser verification is required before any appointment.</textarea></label></div><p class="small">Schedule applies to every weekday in the date range (maximum 90 calendar days). Rates are sample assumptions. All listings are fictional.</p><button class="primary">Publish sample opportunity</button></form>`)}
function saveSeasonalPost(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),span=(new Date(f.to+'T12:00')-new Date(f.from+'T12:00'))/86400000;if(f.to<f.from||f.from<today()||f.deadline<today()||f.deadline>f.from||f.end<=f.start||span>89||postDays(f).length===0){toast('Check dates, times and deadline. Use 1–90 days including at least one weekday.');return}let board=S.role==='board';if(!['school','board'].includes(S.role)||board&&f.kind!=='Exam supervision'||!board&&!['School camp','Summer course'].includes(f.kind)){toast('Choose a role type your organiser can publish.');return}S.opportunities.unshift({...f,id:uid(),school:board?'board':S.school,organiser:board?'Sample National Examination Office':school(S.school).name,rate:Number(f.rate),places:Number(f.places),closed:false});seasonalFilter='All';notify('New sample opportunity: '+f.title+'.');persist();document.getElementById('modal').close();render();toast('Opportunity published in the sample work board.')}

new ResizeObserver(entries=>document.documentElement.style.setProperty('--header-height',entries[0].contentRect.height+'px')).observe(document.querySelector('.top'));
render();persist();new MutationObserver(()=>{if(document.getElementById('mode'))toggleMode()}).observe(document.getElementById('main'),{childList:true});setInterval(()=>{if(!document.getElementById('modal').open&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&!['availability','settings','about','staff'].includes(S.page))render()},60000);
</script></body></html>
